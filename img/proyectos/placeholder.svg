<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#111827"/>
  <!-- Decorative Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(59, 130, 246, 0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <rect width="100%" height="100%" fill="url(#grad)"/>
  
  <!-- Glowing Center Orb -->
  <circle cx="400" cy="300" r="120" fill="#3b82f6" opacity="0.15" filter="blur(40px)"/>
  
  <!-- Visual Mockup Icon -->
  <g transform="translate(400, 260)" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Laptop Icon Shape -->
    <rect x="-45" y="-30" width="90" height="55" rx="4" stroke="rgba(59, 130, 246, 0.8)"/>
    <line x1="-55" y1="25" x2="55" y2="25" stroke="rgba(59, 130, 246, 0.8)"/>
    <line x1="-15" y1="25" x2="-25" y2="32"/>
    <line x1="15" y1="25" x2="25" y2="32"/>
    <line x1="-25" y1="32" x2="25" y2="32"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#9ca3af" text-anchor="middle">
    Vista Previa
  </text>
  <text x="400" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">
    Mockup no disponible
  </text>
</svg>
